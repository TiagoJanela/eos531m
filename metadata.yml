Identifier: eos531m
Slug: hlm-half-life
Status: In progress
Title: Human Liver Microsome Half-Life (PredHLM)
Description: Predicts the metabolic half-life of a small molecule in human liver
  microsomes from its SMILES. An ensemble of five XGBoost models on RDKit 
  descriptors returns the log10 half-life in minutes, the half-life itself, the 
  spread across the five models as an uncertainty estimate, and a 
  similarity-based applicability-domain score.
